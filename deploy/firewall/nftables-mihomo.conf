#!/usr/sbin/nft -f
# Proxy Gateway Plus firewall data plane (single Mihomo instance).
#
# TCP interception is source-scoped to __INTERNAL_CIDR__.  The two port sets
# below come directly from profile.env and are also used by Mihomo's sniffer.
# External ACME HTTP-01 traffic is therefore never redirected.
#
# QUIC=tproxy adds one separate mangle/prerouting chain for only
# __INTERNAL_CIDR__ -> UDP/443 and sends it to Mihomo's native :7895 TPROXY
# listener.  QUIC=reject omits that chain.  There is no TUN, OUTPUT catch-all,
# pxout, second Mihomo process, or second transparent listener.
#
# managed mode owns a source-aware input policy.  external mode removes the
# entire marked input block and makes no claim about host-port exposure; the
# administrator's external firewall remains authoritative.
#
# table comment is the stable ownership marker. Markerless/malformed same-name
# tables remain foreign except for the narrowly recognized old stock migration.
table inet pdg
delete table inet pdg

table inet pdg {
    comment "owner=privdns-gateway;schema=1;component=firewall;mode=__FIREWALL_MODE__"

    set pdg_tls_tcp_ports {
        type inet_service
        flags interval
        elements = { __HIJACK_TLS_TCP_PORTS__ }
    }

    set pdg_http_tcp_ports {
        type inet_service
        flags interval
        elements = { __HIJACK_HTTP_TCP_PORTS__ }
    }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        ip saddr __INTERNAL_CIDR__ tcp dport @pdg_tls_tcp_ports redirect to :7893
        ip saddr __INTERNAL_CIDR__ tcp dport @pdg_http_tcp_ports redirect to :7893
    }

    # PDG_QUIC_TPROXY_BEGIN
    chain pdg_quic_prerouting {
        type filter hook prerouting priority mangle; policy accept;
        # Preserve mark bits outside the project-owned configurable mask.
        ip saddr __INTERNAL_CIDR__ udp dport 443 meta mark set ((meta mark & __QUIC_MARK_CLEAR_MASK__) | __QUIC_MARK__) tproxy ip to :7895 accept
    }
    # PDG_QUIC_TPROXY_END

    # PDG_MANAGED_INPUT_BEGIN
    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        tcp dport { __SSH_PORT__ } accept
        # TCP profile destinations have already been redirected to :7893.
        # :81 exists only on iOS; this list is rendered per platform.
        ip saddr __INTERNAL_CIDR__ tcp dport { __PDG_LOCAL_TCP_PORTS__ } accept
        ip saddr __INTERNAL_CIDR__ udp dport 53 accept
        ip saddr __INTERNAL_CIDR__ udp dport 443 __QUIC_INPUT_ACTION__
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept
    }
    # PDG_MANAGED_INPUT_END
}
